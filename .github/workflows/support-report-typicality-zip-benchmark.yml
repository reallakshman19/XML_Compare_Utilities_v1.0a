name: Support Report Typicality ZIP Benchmark

on:
  pull_request:
    paths:
      - 'benchmarks/1884.zip'
      - 'benchmarks/1885.zip'
      - 'tests/support-report-typicality-zip-benchmark.mjs'
      - 'tests/support-report-typicality-zip-relaxed-diagnostic.mjs'
      - 'tests/support-report-typicality-selected-families.mjs'
      - 'tests/support-report-typicality-ambiguity-diagnostic.mjs'
      - 'tests/support-report-typicality-disagreement-matrix.mjs'
      - 'tests/support-report-typicality-disagreement-matrix.test.mjs'
      - 'tests/support-report-axis-c-calibration-diagnostic.mjs'
      - '.github/workflows/support-report-typicality-zip-benchmark.yml'
      - 'tabs/support-steel-relationship-builder/support-report-*.js'
      - 'tabs/support-steel-relationship-builder/support-primary-*.js'
      - 'tabs/ps-family-clash-audit/ps-family-psclash-xml-parser.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Extract benchmark archives
        run: |
          set -euo pipefail
          rm -rf /tmp/typicality-1884 /tmp/typicality-1885
          mkdir -p /tmp/typicality-1884 /tmp/typicality-1885
          unzip -q benchmarks/1884.zip -d /tmp/typicality-1884
          unzip -q benchmarks/1885.zip -d /tmp/typicality-1885
          echo '1884 XML inventory:'
          find /tmp/typicality-1884 -type f -iname '*.xml' -print | sort
          echo '1885 XML inventory:'
          find /tmp/typicality-1885 -type f -iname '*.xml' -print | sort

      - name: Run 1884 vs 1885 benchmark
        run: >-
          node tests/support-report-typicality-zip-benchmark.mjs
          /tmp/typicality-1884
          /tmp/typicality-1885
          /tmp/typicality-1884-vs-1885.json

      - name: Upload benchmark evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: support-report-typicality-zip-evidence
          path: /tmp/typicality-1884-vs-1885.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run structural vs axis disagreement matrix
        run: >-
          node tests/support-report-typicality-disagreement-matrix.mjs
          /tmp/typicality-1884
          /tmp/typicality-1885
          /tmp/typicality-1884-vs-1885-disagreement-matrix.json

      - name: Upload disagreement matrix evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: support-report-typicality-disagreement-matrix
          path: /tmp/typicality-1884-vs-1885-disagreement-matrix.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run axis C-case calibration ledger
        run: >-
          node tests/support-report-axis-c-calibration-diagnostic.mjs
          /tmp/typicality-1884
          /tmp/typicality-1885
          /tmp/support-report-axis-c-calibration.json

      - name: Upload axis C-case calibration evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: support-report-axis-c-calibration
          path: /tmp/support-report-axis-c-calibration.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate RCA regression controls
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const data = JSON.parse(readFileSync('/tmp/typicality-1884-vs-1885.json', 'utf8'));
          assert.ok(data.diagnostics.acceptedStructuralCount > 0,
            `expected non-zero accepted structural comparisons, got ${data.diagnostics.acceptedStructuralCount}`);
          assert.equal(data.diagnostics.finalFamilyDecisionCount, 351);
          const comparison = data.comparisons[0];

          const ps10076Decision = comparison.familyMatches.find((item) => item.leftFamilyId === 'PS-10076');
          assert.ok(ps10076Decision, 'PS-10076 family decision missing');
          assert.equal(ps10076Decision.result, 'AMBIGUOUS');
          assert.equal(ps10076Decision.reasonCode, 'TYPICAL_AMBIGUOUS');
          assert.equal(ps10076Decision.rightFamilyId, '');
          const ps10076Structural = comparison.familyComparisons.find((item) =>
            item.leftFamilyId === 'PS-10076' && item.rightFamilyId === 'PS-12076');
          assert.ok(ps10076Structural, 'PS-10076 -> PS-12076 structural comparison missing');
          assert.equal(ps10076Structural.result, 'NOT_TYPICAL');
          assert.equal(ps10076Structural.reasonCode, 'TYPICAL_REJECTED_TOPOLOGY');
          assert.equal(ps10076Structural.locationCount, 'FAIL');
          assert.equal(ps10076Structural.uniqueMemberCount, 'PASS');
          assert.equal(ps10076Structural.memberMultiplicity, 'FAIL');
          assert.equal(ps10076Structural.envelope, 'FAIL');
          assert.equal(ps10076Structural.pairDistance, 'FAIL');
          assert.equal(ps10076Structural.envelopeResidualMm, 62);

          const review = comparison.familyMatches.find((item) => item.leftFamilyId === 'PS-10669');
          assert.ok(review, 'PS-10669 family decision missing');
          assert.equal(review.result, 'REVIEW');
          assert.equal(review.rightFamilyId, 'PS-12669');
          assert.equal(review.reasonCode, 'TYPICAL_REVIEW_MEMBER_TOPOLOGY_CHANGED');
          assert.deepEqual(review.failedReasonCodes, [
            'STRUCT_UNIQUE_PRIMARY_MEMBER_COUNT_EQUAL',
            'STRUCT_MEMBER_MULTIPLICITY_EQUAL',
          ]);
          const reviewStructural = comparison.familyComparisons.find((item) =>
            item.leftFamilyId === 'PS-10669' && item.rightFamilyId === 'PS-12669');
          assert.ok(reviewStructural, 'PS-10669 -> PS-12669 structural comparison missing');
          assert.equal(reviewStructural.uniqueMemberCount, 'FAIL');
          assert.equal(reviewStructural.uniqueMemberCountLeft, 6);
          assert.equal(reviewStructural.uniqueMemberCountRight, 5);
          assert.equal(reviewStructural.memberMultiplicity, 'FAIL');
          assert.equal(review.locationAssignmentResult, 'PARTIAL');
          assert.equal(review.correspondenceStatus, 'DETERMINISTIC');
          assert.equal(review.selectedCount, 5);
          assert.equal(review.unmatchedLeftCount, 0);
          assert.equal(review.unmatchedRightCount, 0);
          assert.equal(review.selectedPairs.length, 5);
          assert.equal(review.selectedPairs.every((pair) => pair.pipeClassReasonCode === 'PIPE_CLASS_EXACT'), true);

          const mixedPipeMatch = comparison.familyMatches.find((item) => item.leftFamilyId === 'PS-10092');
          assert.ok(mixedPipeMatch, 'PS-10092 family match missing');
          assert.equal(mixedPipeMatch.rightFamilyId, 'PS-12092');
          assert.equal(mixedPipeMatch.selectedCount, 5);
          assert.equal(mixedPipeMatch.unmatchedLeftCount, 0);
          assert.equal(mixedPipeMatch.unmatchedRightCount, 0);
          assert.equal(mixedPipeMatch.selectedPairs.length, 5);
          assert.equal(mixedPipeMatch.selectedPairs.every((pair) => pair.pipeClassReasonCode === 'PIPE_CLASS_EXACT'), true,
            'normal matcher must never cross-pair incompatible pipe classes');

          const negative = comparison.familyComparisons.find((item) =>
            item.leftFamilyId === 'PS-10146' && item.rightFamilyId === 'PS-12146');
          assert.ok(negative, 'PS-10146 -> PS-12146 negative control missing');
          assert.equal(negative.result, 'NOT_TYPICAL');
          assert.equal(negative.locationCount, 'FAIL');
          const negativeDecision = comparison.familyMatches.find((item) => item.leftFamilyId === 'PS-10146');
          assert.notEqual(negativeDecision?.result, 'TYPICAL');
          assert.notEqual(negativeDecision?.result, 'REVIEW');

          console.log(JSON.stringify({
            acceptedStructuralCount: data.diagnostics.acceptedStructuralCount,
            finalMatchResultHistogram: data.diagnostics.finalMatchResultHistogram,
            ps10076Decision,
            ps10076Structural,
            ps10092: mixedPipeMatch,
            ps10669Review: review,
            ps10669Structural: reviewStructural,
            ps10146Decision: negativeDecision,
            ps10146Negative: negative,
          }, null, 2));
          NODE

      - name: Diagnose ambiguous family candidates with location assignment
        run: >-
          node tests/support-report-typicality-ambiguity-diagnostic.mjs
          /tmp/typicality-1884
          /tmp/typicality-1885
          /tmp/typicality-1884-vs-1885.json

      - name: Run diagnostic with pipe-class candidate gate relaxed
        run: >-
          node tests/support-report-typicality-zip-relaxed-diagnostic.mjs
          /tmp/typicality-1884
          /tmp/typicality-1885

      - name: Run selected family diagnostics
        if: ${{ always() }}
        run: >-
          node tests/support-report-typicality-selected-families.mjs
          /tmp/typicality-1884
          /tmp/typicality-1885
