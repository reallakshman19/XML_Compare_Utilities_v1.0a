# Read-only qualification for truthful CII Writer2 frontier diagnostics (#69).
# PR code is untrusted: no secrets, no pull_request_target, no write permissions.
name: CII Writer2 Frontier Diagnostics
on:
  push:
    branches:
      - fix/cii-writer2-frontier-diagnostics-69
  pull_request:
    paths:
      - 'tabs/cii-workspace/cii-workspace-compare-review.js'
      - 'tabs/cii-workspace/cii-workspace-multisource-review-ui.js'
      - 'tabs/cii-workspace/cii-workspace-propagation.js'
      - 'tests/cii-workspace-frontier-diagnostics.test.js'
      - '.github/workflows/cii-writer2-frontier-diagnostics.yml'

permissions:
  contents: read

jobs:
  review-diagnostics:
    name: Frontier and review authority regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real Node.js focused correspondence/review tests
        run: |
          set -euo pipefail
          node tests/cii-workspace-frontier-diagnostics.test.js
          node tests/cii-workspace-compare-review-ambiguity.test.js
          node tests/cii-workspace-multisource-review-ui.test.js
          node tests/cii-workspace-multisource-review-state.test.js
          node tests/cii-workspace-propagation.test.js
          node tests/cii-workspace-source-target-audit.test.js
  retained-benchmark:
    name: Original multisource benchmark (non-mutating)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Physical S1/S2/S3 to T automatic anchor retention
        run: |
          set -euo pipefail
          node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js
          node tests/cii-workspace-multisource-texpected-benchmark.test.js
  legacy-anchor-differential:
    name: Unchanged main versus PR legacy single-anchor custody check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d58cabe0188fb9a4ebf3f3568b1584abb6824fc8
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject any candidate-only failure against exact unchanged main
        shell: bash
        run: |
          set +e
          (cd baseline && node tests/cii-workspace-single-anchor.test.js > "$RUNNER_TEMP/anchor-baseline.log" 2>&1)
          baseline_status=$?
          (cd candidate && node tests/cii-workspace-single-anchor.test.js > "$RUNNER_TEMP/anchor-candidate.log" 2>&1)
          candidate_status=$?
          set -e
          echo "Exact main test exit: $baseline_status"
          echo "Exact PR test exit: $candidate_status"
          echo "Main tail:"; tail -n 18 "$RUNNER_TEMP/anchor-baseline.log"
          echo "PR tail:"; tail -n 18 "$RUNNER_TEMP/anchor-candidate.log"
          if [[ "$baseline_status" -ne "$candidate_status" ]]; then
            echo "::error::Legacy single-anchor behavior changed relative to exact main"
            exit 1
          fi
          if [[ "$baseline_status" -ne 0 ]]; then
            grep -Fq "TARGET_CUSTODY_AMBIGUOUS" "$RUNNER_TEMP/anchor-baseline.log"
            grep -Fq "TARGET_CUSTODY_AMBIGUOUS" "$RUNNER_TEMP/anchor-candidate.log"
            echo "::warning::PRE-EXISTING single-anchor custody assertion FAILS on exact main and PR; neither is full acceptance"
          else
            echo "Single-anchor legacy check passes on both main and PR"
          fi
