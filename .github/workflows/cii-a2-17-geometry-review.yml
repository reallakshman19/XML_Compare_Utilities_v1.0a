name: CII A2-17 Original Geometry Discrepancy Review
on:
  push:
    branches:
      - feat/cii-a2-17-geometry-review-ui-69-20261014
  pull_request:
    paths:
      - 'tabs/cii-workspace/cii-workspace-geometry-discrepancy-review.js'
      - 'tabs/cii-workspace/cii-workspace-geometry-discrepancy-ui.js'
      - 'tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js'
      - 'tests/cii-workspace-geometry-discrepancy-review.test.js'
      - 'tests/browser/cii-writer2-a2-17-geometry-review.spec.mjs'
      - 'playwright.cii-a2-17.config.mjs'
      - '.github/workflows/cii-a2-17-geometry-review.yml'

permissions:
  contents: read

jobs:
  native-original-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check read-only physical geometry and wired UI
        run: |
          node --check tabs/cii-workspace/cii-workspace-geometry-discrepancy-review.js
          node --check tabs/cii-workspace/cii-workspace-geometry-discrepancy-ui.js
          node --check tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js
      - name: Genuine S1 S2 S3 original geometry 100/200mm, 1500mm and no Writer
        run: node tests/cii-workspace-geometry-discrepancy-review.test.js
      - name: A2-16 authority and persistence regression
        run: node tests/cii-workspace-multisource-anchor-mode.test.js
      - name: A2-16 active-ledger readiness regression
        run: node tests/cii-workspace-multisource-ledger-active-readiness.test.js
      - name: A2-16 user manual and automatic anchor regression
        run: node tests/cii-workspace-multisource-manual-anchor-ui.test.js
      - name: A2-16 restored exact-file session
        run: node tests/cii-workspace-multisource-session-persistence.test.js
      - name: A2-16 retained original whole-source benchmark
        run: node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js
  chromium-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked JS dependencies
        run: npm ci --ignore-scripts
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright original SHA-bound geometry and retained authority
        run: npx playwright test --config=playwright.cii-a2-17.config.mjs
      - name: Preserve Chromium audit JSON and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-a2-17-chromium-original-geometry
          path: |
            test-results/cii-a2-17-browser
            test-results/cii-a2-17-browser.json
          retention-days: 14
          if-no-files-found: warn
