qualification_findings:
  - id: PR1011-QF-001
    finding: Writer 2 cannot treat node-name CREATE as an isolated row insertion because a deterministic target ELEMENT must own the new 1-based pointer.
    disposition: LOWEST_EXACT_ZERO_POINTER_ELEMENT_SELECTION
  - id: PR1011-QF-002
    finding: Deleting one NODENAME row may require pointer changes on unrelated later ELEMENTs due to section compaction.
    disposition: COMPLETE_OLD_TO_NEW_POINTER_MAP_AND_POINTERCHANGES_LEDGER
  - id: PR1011-QF-003
    finding: Existing blank NODENAME physical fields do not require allocation and therefore remain Writer1C existing-row territory.
    disposition: CREATE_EXISTING_FIELD_FAILS_CLOSED_TO_WRITER1C
