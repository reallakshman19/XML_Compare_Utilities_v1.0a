  - parser/**
  - tabs/cii-workspace/cii-workspace-match-methods.js
  - tabs/cii-workspace/cii-workspace-evidence.js
  - tabs/cii-workspace/cii-workspace-candidates.js
  - tabs/cii-workspace/cii-workspace-propagation.js
  - any target CII writer/mutator
implementation_claims:
  - production Transfer Preview consumes the qualified engineering-delta set rather than reinterpreting raw CII property records
  - intended action and execution status are separate authorities
  - hanger 205 is CREATE/BLOCKED because node presence is qualified but creation payload is not
  - SIF raw revision is COPY/BLOCKED because pointer custody is qualified but record rewrite is not
  - geometry, node numbering, topology, OD and wall are protected by default
  - partial process revision retains intended COPY action but remains BLOCKED
  - reviewed/locked correspondence is required; rejected and stale review authority fail closed
  - target mutation remains BLOCKED_NOT_IMPLEMENTED
validation_state: FOCUSED_EXACT_PASS_REAL_BENCHMARK_NOT_RUN
remaining_validation_gates:
  - tests/cii-workspace-transfer-preview-ui.test.js runtime
  - tests/cii-workspace-benchmark-transfer-preview.test.js
  - upstream tests/cii-workspace-benchmark-qualification.test.js
  - upstream tests/cii-workspace-benchmark-end-to-end.test.js
  - inherited CII Workspace regression/UI lifecycle as applicable
known_limits:
  - hanger create payload HGRDAT/TAG/GUID not qualified
  - SIF/Tee raw record writer not qualified
  - process transfer partial authority only
  - no target writer or modified target CII export
