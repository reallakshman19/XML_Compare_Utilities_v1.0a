    evidence_required: true
  - id: Q2
    focus: ENGINEERING_PROBLEM
    anchors: [WP-ARCH-001, INPUT-02, AC-01]
    prompt: Reconstruct a reviewed NodeName replacement from raw transfer intent to its post-Writer2 representation. Explain why downstream selector changes alone cannot recover intent that has already been rewritten BLOCKED.
    reconstruction_mode: LOGIC_RECONSTRUCTION
    payload:
      source: tabs/cii-workspace/cii-workspace-core.js; tabs/cii-workspace/cii-workspace-writer2-routing.js; tabs/cii-workspace/cii-workspace-multisource-preview.js
