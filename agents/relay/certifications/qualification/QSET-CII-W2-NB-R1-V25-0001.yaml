        source_value: NONBLANK_A
        target_value: NONBLANK_B
        source_not_equal_target: true
    required_output_keys: [reconstruction_steps, intermediate_result, expected_result]
    evidence_required: true
  - id: Q3
    focus: BOUNDARIES_INVARIANTS
    anchors: [WP-ARCH-001, AC-02]
    prompt: Apply an extra TARGET-only branch to a topology where every SOURCE frontier edge has a unique injective target match. State the correct propagation result, then state the missing-target-support and symmetric-ambiguity falsifiers that must still fail closed.
    mutation:
      condition: Add one unmatched TARGET-only frontier edge after the anchor while preserving all SOURCE-edge candidates.
      protected_invariant: Every SOURCE edge must be mapped injectively; TARGET-only remainder need not be claimed.
      falsifier: Any SOURCE edge lacks a valid target candidate, or two equally valid injective assignments remain without the required winner gap.
    required_output_keys: [mutation_effect, protected_invariant, falsifier]
    evidence_required: true
  - id: Q4
    focus: VERIFICATION
    anchors: [AC-03, TEST-03, BENCH-01, BENCH-02]
    prompt: Define an independent byte oracle for the later mixed transaction. It must not import the production splice/relocation/projector and must distinguish pure REPLACE authorized spans from structural CREATE/DELETE count/pointer/row closure.
    oracle_refs: [BENCH-01, BENCH-02]
    independence_requirement: Derive allowed byte offsets/physical-unit closure from fixed-format contract and before/after bytes, not from production mutation output metadata.
    required_output_keys: [independent_method, predicted_result, tolerance_or_exactness]
    evidence_required: true
  - id: Q5
    focus: FIRST_SAFE_SLICE
    anchors: [STEP-01, AC-01, AC-02, TEST-01, TEST-02]
    prompt: State the first exact bounded downstream product change that should be implemented after this architecture/oracle gate, with predicted before/after behavior and a negative test. Do not broaden Writer2 overwrite authority.
    step_refs: [STEP-01]
    required_output_keys: [first_change, predicted_before, predicted_after, verification]
    evidence_required: true
