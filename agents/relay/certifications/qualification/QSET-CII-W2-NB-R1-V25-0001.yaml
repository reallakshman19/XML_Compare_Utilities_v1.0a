    focus: PRODUCTION_PATH
    anchors: [WP-ARCH-001, INPUT-02]
    prompt: Trace createCiiWorkspacePreview through rawTransferPlan, Writer2 contraction, member preview and combined multisource transfer plan. Identify the first point where nonblank-to-different-nonblank NodeName REPLACE becomes unavailable to multisource arbitration.
