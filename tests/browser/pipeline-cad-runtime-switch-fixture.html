<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pipeline CAD Runtime Switch Fixture</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#020617;color:#e2e8f0;font-family:system-ui,sans-serif}.pipeline-3d-model-dialog{padding:12px}.raw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}textarea{width:100%;height:96px;background:#0f172a;color:#cbd5e1;border:1px solid #334155}.modal{position:relative;display:block;min-height:520px;padding:12px 12px 52px;background:#0f172a}.previews{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{height:430px;overflow:hidden;border:1px solid #334155;background:#0b1220}.legacy{width:100%;height:100%;background:#111827}.outputs{display:none}
  </style>
</head>
<body>
  <main class="pipeline-3d-model-dialog">
    <section class="raw">
      <textarea data-p3d-split="table2a-raw">H(coor)	V(coor)	[H vs V] Length	Station Text	Elevation Text
659.791	—	—	0+000.0	231.32
680.803	-715.825 → -650.258	65.567	0+019.0	230.82
732.683	—	—	0+070.8	233.00</textarea>
      <textarea data-p3d-split="table3a-raw">From H(coor)	To H(coor)	Text Position X	HLength Text
661.791	682.337	671.704	20.5
682.337	716.683	700.435	34.3
716.683	732.683	723.927	16.0</textarea>
      <textarea data-p3d-split="table3b-raw">From H(coor)	To H(coor)	Text Position X	Z Text
—	—	665.621	A/G
682.337	732.683	708.374	1.5M</textarea>
      <textarea data-p3d-split="table3c-raw">Text Position X	Marker Text
688.135	PM-001</textarea>
    </section>
    <section class="modal" data-p3d-split="x-modal">
      <div class="previews">
        <div class="preview" data-p3d-split="table2x-preview"><svg class="legacy" data-p3d-legacy-svg="table2x"></svg></div>
        <div class="preview" data-p3d-split="table3x-preview"><svg class="legacy" data-p3d-legacy-svg="table3x"></svg></div>
      </div>
    </section>
    <section class="outputs">
      <table data-p3d="table2x-output"><tbody><tr><td>0+019.0</td><td>230.82</td></tr></tbody></table>
      <table data-p3d="table3x-output"><tbody><tr><td>682.337</td><td>732.683</td><td>708.374</td><td>1.5M</td></tr></tbody></table>
    </section>
  </main>
  <script type="module">
    await import('../../tabs/pipeline-3d-model/pipeline-3d-model-config.js');
    const frame=()=>new Promise((resolve)=>requestAnimationFrame(resolve));
    const settle=async()=>{await frame();await frame();await frame();};
    await settle();
    const dialog=document.querySelector('.pipeline-3d-model-dialog');
    let workspace=null;
    let workspaceModule=null;
    const loadWorkspaceModule=async()=>workspaceModule||(workspaceModule=await import('../../tabs/pipeline-3d-model/pipeline-3d-model-cad-workspace.js?v=20260713-cad-workspace-1'));
    if(localStorage.getItem('pipeline3dCadRenderer')==='canvas'){
      const module=await loadWorkspaceModule();
      workspace=module.mountPipelineCadWorkspace(dialog,{force:true});
      await settle();
    }
    const expose=()=>{window.__pipelineCadRuntimeWorkspace=workspace;};
    expose();
    window.__pipelineCadSetRaw=(name,value)=>{
      const element=dialog.querySelector(`[data-p3d-split="${name}-raw"]`);
      element.value=value;
      element.dispatchEvent(new Event('input',{bubbles:true}));
    };
    window.__pipelineCadDestroy=()=>{
      if(!workspace)return false;
      const current=workspace;
      workspace=null;
      expose();
      current.destroy();
      return true;
    };
    window.__pipelineCadRemount=async()=>{
      const module=await loadWorkspaceModule();
      workspace=module.mountPipelineCadWorkspace(dialog,{force:true});
      expose();
      await settle();
      return Boolean(workspace);
    };
    window.__pipelineCadResizeBurst=async(count=100)=>{
      for(let index=0;index<count;index+=1)workspace?.resize?.();
      await settle();
    };
    window.__pipelineCadLifecycleState=async()=>{
      const lifecycle=await import('../../tabs/pipeline-3d-model/pipeline-3d-model-cad-lifecycle-performance.js');
      return {
        table2x:workspace?.graphs?.table2x?lifecycle.getPipelineCadLifecycleStats(workspace.graphs.table2x):null,
        table3x:workspace?.graphs?.table3x?lifecycle.getPipelineCadLifecycleStats(workspace.graphs.table3x):null,
      };
    };
    window.__pipelineCadRuntimeState=()=>({
      renderer:localStorage.getItem('pipeline3dCadRenderer'),
      canvasStages:document.querySelectorAll('[data-p3d-cad-stage]').length,
      legacySvgs:document.querySelectorAll('[data-p3d-legacy-svg]').length,
      label:document.querySelector('[data-p3d-cad-renderer-label]')?.textContent||'',
      action:document.querySelector('[data-p3d-cad-renderer-switch]')?.textContent||'',
      status:[...document.querySelectorAll('[data-p3d-cad-status]')].map((node)=>node.textContent),
      table2Rows:workspace?.controller?.model?.table2Rows?.length||0,
      table3LengthRows:workspace?.controller?.model?.table3LengthRows?.length||0,
      history:{
        undo:workspace?.controller?.history?.undoStack?.length||0,
        redo:workspace?.controller?.history?.redoStack?.length||0,
      },
    });
    document.body.dataset.pipelineCadRuntimeReady='1';
  </script>
</body>
</html>
