<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revision Compare layout proof</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020817;color:#fff;font-family:system-ui,sans-serif}
    #tiles{padding:24px}.psmap-card{padding:16px;background:#0b1d2e;color:#fff;border:1px solid #294764;border-radius:10px}

</head>
<body>
  <div id="tiles"></div>
  <script type="module">
    import { installRevisionCompareTile } from '../../tabs/revision-compare/revision-compare-tab.js';

    installRevisionCompareTile(document.querySelector('#tiles'),{showToast:(...args)=>window.revcLayoutToasts.push(args)});
  </script>
