<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editable Topology Draft Fixture</title>
  <style>html,body,#fixture{height:100%;margin:0;background:#020617}</style>
</head>
<body>
  <div id="fixture"></div>
  <script type="module">
    import { mountTopologyTraceValidatorWorkspace } from '../../tabs/topology-trace-validator/topology-trace-validator-tab.js';
    import { buildComponentTopologyArtifacts } from '../../vendor/3d-converters/topology-browser-core.mjs';

    const point = (x, y, z) => ({ x, y, z });
    const source = [{
      name: '/EDIT/B1', type: 'BRANCH',
      attributes: { TYPE: 'BRANCH', NAME: '/EDIT/B1', OWNER: '/EDIT', HPOS: point(0, 0, 0), TPOS: point(2000, 0, 0) },
      children: [
        { name: 'PIPE-1', type: 'PIPE', attributes: { TYPE: 'PIPE', NAME: 'PIPE-1', REF: '=PIPE/1', OWNER: '/EDIT/B1', APOS: point(0, 0, 0), LPOS: point(1000, 0, 0), ABORE: '50mm', LBORE: '50mm', WTHK: '3mm', ITEMTEMP1: '100', ITEMPRES1: '2', MTXX: 'A106 B', DTXR: 'PIPE' } },
        { name: 'PIPE-2', type: 'PIPE', attributes: { TYPE: 'PIPE', NAME: 'PIPE-2', REF: '=PIPE/2', OWNER: '/EDIT/B1', APOS: point(1000, 0, 0), LPOS: point(2000, 0, 0), ABORE: '50mm', LBORE: '50mm', WTHK: '3mm', ITEMTEMP1: '100', ITEMPRES1: '2', MTXX: 'A106 B', DTXR: 'PIPE' } },
      ],
    }];
    const built = await buildComponentTopologyArtifacts(JSON.stringify(source), {
      sourceName: 'edit-browser-fixture.json', jobName: 'Edit Browser Fixture',
      toleranceMm: 0.1, supportProjectionToleranceMm: 50, enrichmentConfig: {},
    });
    const mounted = await mountTopologyTraceValidatorWorkspace(document.querySelector('#fixture'), {
      source,
      canonical: built.canonicalTopology,
      ledger: built.traceLedger,
      inputXml: built.topologyInputXml,
      scene: built.topologySvgScene,
      parsed: built.parsedInputXmlTopology,
      report: built.topologyParityReport,
    });
    window.__topologyEditHarness = mounted;
    document.body.dataset.topologyEditFixtureReady = '1';
  </script>
</body>
</html>
