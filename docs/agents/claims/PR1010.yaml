qualification_findings:
  - id: PR1010-QF-001
    finding: Existing standalone Writer1B internally chains Writer1A output before Writer1B-only mutation, so standalone Writer1B application cannot itself define the general mixed-transaction preimage authority.
    disposition: RESOLVED_BY_SEPARATE_ONE_PREIMAGE_COMPOSITE_ORCHESTRATOR
  - id: PR1010-QF-002
    finding: Initial composite readiness omitted the legacy mutationCount field expected by downstream stage/audit consumers.
    disposition: FIXED_COMPATIBILITY_FIELD_RESTORED
  - id: PR1010-QF-003
    finding: Initial same-span arbitration allowed identical claims from different writer families to canonicalize.
    disposition: FIXED_CROSS_FAMILY_SAME_SPAN_ALWAYS_BLOCKS
  - id: PR1010-QF-004
    finding: Initial lower mutation ledger lumped Writer1A and Writer1B together instead of preserving policy authority identity.
    disposition: FIXED_EXPLICIT_WRITER1A_WRITER1B_AUTHORITY_REQUIRED
  - id: PR1010-QF-005
    finding: Initial mixed regression covered Writer1B plus Writer1C but not all three writer families simultaneously.
    disposition: COVERAGE_CLOSED_WITH_THREE_FAMILY_SYNTHETIC_TEST
  - id: PR1010-QF-006
    finding: Initial final composite validator used writerResult.mutations as the authorized span union, making Writer testimony the source of S_auth.
    disposition: FIXED_VALIDATOR_NOW_RECONSTRUCTS_UNION_FROM_COMPONENT_DRY_RUNS_AND_REQUIRES_WRITER_LEDGER_EXACT_MATCH
